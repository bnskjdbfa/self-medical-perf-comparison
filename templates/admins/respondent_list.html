<h1>응답자 제출 목록</h1>
<table>
  <thead>
    <tr><th>이름</th><th>팀코드</th><th>일차</th><th>제출여부</th><th>제출시각</th><th>상세</th></tr>
  </thead>
  <tbody>
    {% for item in submissions %}
      <tr>
        <td>{{ item.respondent_name }}</td>
        <td>{{ item.team_code }}</td>
        <td>{{ item.day_no }}</td>
        <td>제출완료</td>
        <td>{{ item.submitted_at }}</td>
        <td><a href='{% url "admins:response-detail-debug" item.submission_id %}'>보기</a></td>
      </tr>
    {% empty %}
      <tr><td colspan='6'>데이터 없음</td></tr>
    {% endfor %}
  </tbody>
</table>
