{% extends "admins/two_factor_base.html" %}
{% block title %}인증 앱 등록{% endblock %}
{% block content %}
  <h1>2단계 인증 등록</h1>
  <p>인증 앱에서 QR 코드를 스캔한 뒤 표시되는 6자리 코드를 입력해주세요.</p>
  <img class="two-factor-qr" src="{% url 'admins:two-factor-qr' %}" alt="2단계 인증 등록 QR 코드" />
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}" />
    {{ form.non_field_errors }}
    <label for="{{ form.token.id_for_label }}">{{ form.token.label }}</label>
    {{ form.token }}
    {{ form.token.errors }}
    <button type="submit">등록 및 인증</button>
  </form>
{% endblock %}
